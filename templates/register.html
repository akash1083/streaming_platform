<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register | ShortFilm Hub</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#141E30,#243B55);
}

.register-box{
    width:420px;
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(15px);
    padding:40px;
    border-radius:18px;
    box-shadow:0 10px 30px rgba(0,0,0,.4);
    animation:fade .8s;
}

@keyframes fade{
    from{
        opacity:0;
        transform:translateY(-20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.logo{
    text-align:center;
    font-size:38px;
    color:#00d4ff;
}

h2{
    text-align:center;
    color:white;
    margin:10px 0 30px;
}

.input-box{
    margin-bottom:18px;
}

.input-box input{
    width:100%;
    padding:14px;
    border:none;
    border-radius:8px;
    outline:none;
    font-size:15px;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:8px;
    background:#00bfff;
    color:white;
    font-size:17px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#009acd;
}

.login{
    margin-top:20px;
    text-align:center;
    color:white;
}

.login a{
    color:#00d4ff;
    text-decoration:none;
    font-weight:bold;
}

.messages{
    margin-bottom:20px;
}

.success{
    background:#28a745;
    color:white;
    padding:10px;
    border-radius:6px;
    margin-bottom:10px;
}

.error{
    background:#dc3545;
    color:white;
    padding:10px;
    border-radius:6px;
    margin-bottom:10px;
}

</style>

</head>

<body>

<div class="register-box">

<div class="logo">🎬</div>

<h2>Create Your Account</h2>

{% if messages %}
<div class="messages">
{% for message in messages %}
<div class="{{ message.tags }}">
{{ message }}
</div>
{% endfor %}
</div>
{% endif %}

<form method="POST">

{% csrf_token %}

<div class="input-box">
<input type="text" name="username" placeholder="Username" required>
</div>

<div class="input-box">
<input type="email" name="email" placeholder="Email Address" required>
</div>

<div class="input-box">
<input type="password" name="password" placeholder="Password" required>
</div>

<div class="input-box">
<input type="text" name="phone_no" placeholder="Phone Number" required>
</div>

<button type="submit">
Create Account
</button>

</form>

<div class="login">
Already have an account?
<a href="{% url 'login' %}">Login</a>
</div>

</div>

</body>
</html>
