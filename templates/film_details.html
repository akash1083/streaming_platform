<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ film.title }}</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:linear-gradient(135deg,#141E30,#243B55);
    color:white;
}

.navbar{
    background:#111;
    padding:15px 40px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:30px;
    color:#00d4ff;
    font-weight:bold;
}

.navbar a{
    text-decoration:none;
    color:white;
    background:#00bfff;
    padding:10px 18px;
    border-radius:8px;
    transition:.3s;
}

.navbar a:hover{
    background:#008fd1;
}

.container{
    width:90%;
    max-width:1100px;
    margin:40px auto;
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(15px);
    border-radius:15px;
    padding:30px;
    box-shadow:0 10px 25px rgba(0,0,0,.4);
}

.video-box{
    display:flex;
    justify-content:center;
    margin-bottom:30px;
}

iframe{
    width:100%;
    max-width:900px;
    height:500px;
    border:none;
    border-radius:12px;
    box-shadow:0 8px 20px rgba(0,0,0,.5);
}

.details{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:25px;
}

.card{
    background:rgba(255,255,255,.08);
    padding:20px;
    border-radius:12px;
}

.card h3{
    color:#00d4ff;
    margin-bottom:12px;
}

.title{
    text-align:center;
    font-size:40px;
    margin-bottom:30px;
    color:#00d4ff;
}

.loading{
    text-align:center;
    color:#ddd;
    display:none;
    margin-bottom:20px;
}

@media(max-width:768px){

.details{
grid-template-columns:1fr;
}

iframe{
height:250px;
}

.title{
font-size:28px;
}
.watch-btn{
    display:inline-block;
    background:#ff9800;
    color:white;
    padding:12px 28px;
    text-decoration:none;
    border-radius:8px;
    font-size:18px;
    font-weight:bold;
    transition:.3s;
}

.watch-btn:hover{
    background:#e68900;
    transform:translateY(-2px);
}

}

</style>

</head>

<body>

<div class="navbar">

<div class="logo">
🎬 ShortFilm Hub
</div>

<div>
<a href="{% url 'home' %}">⬅ Back</a>
</div>

</div>

<div class="container">

<h1 class="title">{{ film.title }}</h1>

<div class="loading" id="loading">
Loading video...
</div>

<div class="video-box">

<iframe
    id="video"
    width="900"
    height="500"
    src="{{ embed_url }}"
    title="{{ film.title }}"
    frameborder="0"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
    referrerpolicy="strict-origin-when-cross-origin"
    allowfullscreen>
</iframe>

</div>
<div style="text-align:center; margin-bottom:25px;">

    <a href="{% url 'add_watch_later' film.id %}" class="watch-btn">
        ⭐ Watch Later
    </a>

</div>


<div class="details">

<div class="card">
<h3>📖 Description</h3>
<p>{{ film.description }}</p>
</div>

<div class="card">
<h3>🎭 Category</h3>
<p>{{ film.category.category_name }}</p>

<br>

<h3>⏱ Duration</h3>
<p>{{ film.duration }}</p>

<br>

<h3>📅 Uploaded</h3>
<p>{{ film.uploaded_at|date:"d M Y" }}</p>
</div>

</div>

</div>

<script>
