<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upload Short Film</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:linear-gradient(135deg,#141E30,#243B55);
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:30px;
}

.container{
    width:100%;
    max-width:650px;
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(15px);
    border-radius:15px;
    padding:35px;
    box-shadow:0 10px 25px rgba(0,0,0,.4);
    color:white;
}

h2{
    text-align:center;
    margin-bottom:25px;
    color:#00d4ff;
}

label{
    display:block;
    margin:15px 0 8px;
    font-weight:bold;
}

input,
textarea,
select{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    outline:none;
    font-size:15px;
}

textarea{
    resize:none;
    height:120px;
}

input[type="file"]{
    background:white;
    color:black;
    padding:10px;
}

button{
    width:100%;
    margin-top:25px;
    padding:14px;
    background:#00bfff;
    color:white;
    border:none;
    border-radius:8px;
    font-size:17px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#0099cc;
}

.preview{
    margin-top:15px;
    text-align:center;
}

.preview img{
    width:220px;
    border-radius:10px;
    display:none;
    margin:auto;
    box-shadow:0 5px 15px rgba(0,0,0,.4);
}

.back{
    display:inline-block;
    margin-bottom:20px;
    color:white;
    text-decoration:none;
    background:#444;
    padding:10px 18px;
    border-radius:8px;
}

.back:hover{
    background:#666;
}

</style>

</head>
<body>

<div class="container">

<a href="{% url 'home' %}" class="back">⬅ Back</a>

<h2>🎬 Upload Short Film</h2>

<form method="POST" enctype="multipart/form-data">

    {% csrf_token %}

    <label>Title</label>
    <input type="text" name="title" required>

    <label>Description</label>
    <textarea name="description" required></textarea>

    <label>Duration</label>
    <input type="text" name="duration" placeholder="15 Minutes" required>

    <label>Category</label>
    <select name="category" required>
        <option value="">Select Category</option>
        {% for category in categories %}
        <option value="{{ category.id }}">
            {{ category.category_name }}
        </option>
        {% endfor %}
    </select>

    <label>YouTube Link</label>
    <input type="url" name="youtube_link" placeholder="https://www.youtube.com/watch?v=..." required>

    <label>Thumbnail</label>
    <input type="file" name="thumbnail" id="thumbnail" accept="image/*" required>

    <div class="preview">
        <img id="previewImage">
    </div>

    <button type="submit">
        Upload Film
    </button>

</form>

</div>

<script>

const input=document.getElementById("thumbnail");
const preview=document.getElementById("previewImage");

input.onchange=function(){

const file=this.files[0];

if(file){

preview.src=URL.createObjectURL(file);
preview.style.display="block";

}

}

</script>

</body>
</html>
