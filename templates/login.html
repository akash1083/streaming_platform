<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | ShortFilm Hub</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#141E30,#243B55);
}

.login-box{
    width:400px;
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(15px);
    padding:40px;
    border-radius:18px;
    box-shadow:0 10px 30px rgba(0,0,0,.4);
    animation:fade .8s;
}

@keyframes fade{
    from{
        opacity:0;
        transform:translateY(-20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.logo{
    text-align:center;
    font-size:45px;
    margin-bottom:10px;
}

h2{
    text-align:center;
    color:white;
    margin-bottom:25px;
}

.message{
    padding:12px;
    border-radius:8px;
    margin-bottom:15px;
    color:white;
    text-align:center;
    font-weight:bold;
}

.success{
    background:#28a745;
}

.error{
    background:#dc3545;
}

.input-box{
    margin-bottom:18px;
}

.input-box input{
    width:100%;
    padding:14px;
    border:none;
    border-radius:8px;
    outline:none;
    font-size:16px;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:8px;
    background:#00bfff;
    color:white;
    font-size:17px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#008fd1;
}

.register{
    margin-top:20px;
    text-align:center;
    color:white;
}

.register a{
    color:#00d4ff;
    text-decoration:none;
    font-weight:bold;
}

.register a:hover{
    text-decoration:underline;
}

</style>

</head>

<body>

<div class="login-box">

<div class="logo">🎬</div>

<h2>ShortFilm Hub</h2>

{% if messages %}
    {% for message in messages %}
        <div class="message {{ message.tags }}">
            {{ message }}
        </div>
    {% endfor %}
{% endif %}

<form method="POST">

{% csrf_token %}

<div class="input-box">
<input type="text" name="username" placeholder="Username" required>
</div>

<div class="input-box">
<input type="password" name="password" placeholder="Password" required>
</div>

<button type="submit">
Login
</button>

</form>

<div class="register">
Don't have an account?
<a href="{% url 'register' %}">Register</a>
</div>

</div>

</body>
</html>
