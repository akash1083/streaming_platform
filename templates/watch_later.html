<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watch Later</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:linear-gradient(135deg,#141E30,#243B55);
    color:white;
}

.navbar{
    background:#111;
    padding:15px 40px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:28px;
    font-weight:bold;
    color:#00d4ff;
}

.navbar a{
    text-decoration:none;
    color:white;
    background:#00bfff;
    padding:10px 18px;
    border-radius:8px;
}

.container{
    width:90%;
    margin:40px auto;
}

.heading{
    text-align:center;
    margin-bottom:30px;
    color:#00d4ff;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:25px;
}

.card{
    background:rgba(255,255,255,.08);
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 8px 20px rgba(0,0,0,.4);
}

.card img{
    width:100%;
    height:180px;
    object-fit:cover;
}

.content{
    padding:20px;
}

.content h3{
    margin-bottom:10px;
}

.content p{
    color:#ddd;
    margin-bottom:20px;
}

.buttons{
    display:flex;
    gap:10px;
}

.btn{
    flex:1;
    text-align:center;
    text-decoration:none;
    color:white;
    padding:10px;
    border-radius:8px;
}

.watch{
    background:#00b894;
}

.remove{
    background:#e74c3c;
}

.empty{
    text-align:center;
    font-size:24px;
    margin-top:100px;
}
</style>

</head>
<body>

<div class="navbar">
    <div class="logo">🎬 ShortFilm Hub</div>

    <a href="{% url 'home' %}">🏠 Home</a>
</div>

<div class="container">

<h1 class="heading">⭐ My Watch Later</h1>

{% if films %}

<div class="grid">

{% for item in films %}

<div class="card">

    <img src="{{ item.shortfilm.thumbnail.url }}" alt="{{ item.shortfilm.title }}">

    <div class="content">

        <h3>{{ item.shortfilm.title }}</h3>

        <p>⏱ {{ item.shortfilm.duration }}</p>

        <div class="buttons">

            <a href="{% url 'film_details' item.shortfilm.id %}" class="btn watch">
                ▶ Watch
            </a>

            <a href="{% url 'remove_watch_later' item.shortfilm.id %}" class="btn remove">
                🗑 Remove
            </a>

        </div>

    </div>

</div>

{% endfor %}

</div>

{% else %}

<div class="empty">
    <h2>📺 Your Watch Later list is empty.</h2>
</div>

{% endif %}

</div>

</body>
</html>
